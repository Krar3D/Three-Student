<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.75 'Noto Naskh Arabic',Tahoma,serif}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-block:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;padding:.5rem}
button{font:inherit;font-size:.95rem;line-height:1.4;cursor:pointer;color:var(--ink);background:var(--pg);border:1px solid var(--line);border-radius:6px;padding:.2rem .8rem}

main{max-width:760px;margin:0 auto;padding:0 1rem 3rem;scroll-margin-top:3.5rem}

table{border-collapse:collapse;width:100%}

.ir{color:var(--ac);font-weight:700}

<script>
const $=s=>document.querySelector(s);
const ss=window.speechSynthesis;let slow=0,vo;
const pick=()=>{const v=ss.getVoices();vo=v.find(x=>x.lang.replace('_','-')==='en-GB')||v.find(x=>/^en/.test(x.lang))};
if(ss){pick();ss.onvoiceschanged=pick}else $('#hint').textContent='متصفحك لا يدعم النطق الصوتي.';
function speak(t,el){const u=new SpeechSynthesisUtterance(t.replace(/[✓✗]/g,''));u.lang='en-GB';if(vo)u.voice=vo;u.rate=slow?.6:.9;if(el){u.onstart=()=>el.classList.add('on');u.onend=u.onerror=()=>el.classList.remove('on')}ss.speak(u)}
function say(t,el){if(!ss)return;ss.cancel();speak(t,el)}
const en=t=>t.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ');
const row=(e,a,n)=>`<div class="ln" data-t="${e}"><button class="sp" aria-label="استمع">🔊</button><div><p class="en" lang="en">${n?`<b>${n}</b> `:''}${en(e)}</p><p class="ar">${a}</p></div></div>`;

const S=[
['Part 1: Who copied the exam questions?','الجزء الأول: من نسخ أسئلة الامتحان؟',[
['SHERLOCK HOLMES was staying in one of England’s most famous university towns.','كان شارلوك هولمز يقيم في واحدة من أشهر المدن الجامعية في إنجلترا.'],
['One evening he received a visit from an old friend, Mr Henry Weaver, a tutor at one of the colleges. He seemed very nervous and excited.','في إحدى الأمسيات تلقى زيارة من صديق قديم، السيد هنري ويفر، وهو مدرس في إحدى الكليات. بدا عصبيًا ومتحمسًا جدًا.'],
['“I need your help, Holmes. Something very serious happened at my college this afternoon.”','«أحتاج مساعدتك يا هولمز. حدث شيء خطير جدًا في كليتي بعد ظهر اليوم.»'],
['Holmes was very busy. “Why didn’t you call the police?” he said irritably.','كان هولمز مشغولًا جدًا. قال بانزعاج: «لماذا لم تتصل بالشرطة؟»'],
['“No, no that’s impossible. We can’t have a scandal at the college. Let me explain.”','«لا، لا هذا مستحيل. لا يمكن أن نسمح بفضيحة في الكلية. دعني أشرح لك.»'],
['“You see, tomorrow is the first day of the university examinations, and this afternoon I received the Greek translation papers.”','«كما ترى، غدًا هو اليوم الأول للامتحانات الجامعية، وبعد ظهر اليوم استلمت أوراق الترجمة اليونانية.»'],
['“I put them on the desk in my room while I went to have tea with a friend. When I returned, I saw immediately that the papers were lying on the floor by the window.”','«وضعتها على المكتب في غرفتي بينما ذهبت لتناول الشاي مع صديق. عندما عدت، رأيت على الفور أن الأوراق ملقاة على الأرض بجانب النافذة.»'],
['“I see,” said Holmes. “Please continue.”','قال هولمز: «فهمت. أرجوك أكمل.»'],
['“Well, at first I thought that perhaps my servant, Bannister, was responsible, but of course he said no, and I believe him. He and I examined the room very carefully.”','«حسنًا، في البداية اعتقدت أن خادمي، بانيستر، ربما كان المسؤول، لكنه بالطبع قال لا، وأنا أصدقه. قمنا أنا وهو بفحص الغرفة بعناية شديدة.»'],
['“And what did you find?” asked Holmes impatiently.','سأل هولمز بنفاد صبر: «وماذا وجدتم؟»'],
['“On the table next to the window we found a broken pencil. Also, on my desk there was a small ball of black mud. There were no signs of entry at the window.”','«على الطاولة بجوار النافذة وجدنا قلم رصاص مكسورًا. وأيضًا، على مكتبي كانت هناك كرة صغيرة من الطين الأسود. لم تكن هناك علامات دخول من النافذة.»'],
['“Please help me, Holmes. It’s clear that someone copied the exam questions. If I don’t find who did it, I will have to cancel the exam and there will be a scandal.”','«أرجوك ساعدني يا هولمز. من الواضح أن شخصًا ما قد نسخ أسئلة الامتحان. إذا لم أجد من فعل ذلك، سأضطر إلى إلغاء الامتحان وستحدث فضيحة.»'],
['“I need to visit your room,” said Holmes.','قال هولمز: «أحتاج لزيارة غرفتك.»']]],
['Part 2: Looking for clues','الجزء الثاني: البحث عن أدلة',[
['They walked towards the tutor’s room, which was on the ground floor. Holmes tried to look in through the window but he wasn’t tall enough.','سارا باتجاه غرفة المدرس، والتي كانت في الطابق الأرضي. حاول هولمز النظر من خلال النافذة لكنه لم يكن طويلًا بما يكفي.'],
['Above lived three students, one on each floor. Holmes entered the room and examined the carpet.','يسكن في الأعلى ثلاثة طلاب، واحد في كل طابق. دخل هولمز الغرفة وفحص السجادة.'],
['“Nothing,” he said. “Let me look at the table by the window.”','قال: «لا شيء. دعني أنظر إلى الطاولة بجوار النافذة.»'],
['“What can you see?”','«ماذا ترى؟»'],
['“Ah, yes, it’s clear what happened. Someone took the papers one at a time from your desk over to the window table to copy them, because from there he could see when you were returning.”','«آه، نعم، من الواضح ما حدث. أخذ شخص ما الأوراق ورقة تلو الأخرى من مكتبك إلى طاولة النافذة لنسخها، لأنه من هناك يمكنه رؤيتك عندما تعود.»'],
['“But nobody could see me. I came back through the side door.”','«لكن لم يستطع أحد رؤيتي. لقد عدت من خلال الباب الجانبي.»'],
['“Ah, so you surprised him and he had to leave hurriedly. Did you hear someone running away as you entered?”','«آه، إذن لقد فاجأته واضطر للمغادرة على عجل. هل سمعت شخصًا يهرب عندما دخلت؟»'],
['“No.”','«لا.»'],
['“Interesting. So, we just have one small ball of black mud as a clue. Now tell me, where does that door go to?”','«مثير للاهتمام. إذن، لدينا فقط كرة صغيرة واحدة من الطين الأسود كدليل. الآن أخبرني، إلى أين يؤدي ذلك الباب؟»'],
['“My bedroom.”','«غرفة نومي.»'],
['“Can I examine it?”','«هل يمكنني فحصها؟»'],
['“Yes, of course.”','«نعم، بالطبع.»'],
['Holmes followed Weaver into his bedroom.','تبع هولمز ويفر إلى غرفة نومه.'],
['“Hello,” said Holmes, “what’s this? Another small ball of black mud, exactly like the one on the desk. Clearly your visitor came into the bedroom.”','قال هولمز: «مرحبًا، ما هذا؟ كرة صغيرة أخرى من الطين الأسود، تمامًا مثل تلك التي على المكتب. من الواضح أن زائرك دخل إلى غرفة النوم.»'],
['“I don’t understand. Why did he do that?”','«أنا لا أفهم. لماذا فعل ذلك؟»'],
['“Well, when you came back so suddenly, he ran into your bedroom to hide. Look at the bedroom window, it’s open. That is obviously how he escaped.”','«حسنًا، عندما عدت فجأة، ركض إلى غرفة نومك ليختبئ. انظر إلى نافذة غرفة النوم، إنها مفتوحة. من الواضح أن هذه هي الطريقة التي هرب بها.»']]],
['Part 3: The three suspects','الجزء الثالث: المشتبه بهم الثلاثة',[
['“Now,” said Holmes, “the three students who live above you. Are they all taking this examination?”','قال هولمز: «الآن، الطلاب الثلاثة الذين يعيشون فوقك. هل جميعهم سيؤدون هذا الامتحان؟»'],
['“Yes.”','«نعم.»'],
['“Tell me about them.”','«أخبرني عنهم.»'],
['“Well, on the first floor is Gresham, an excellent student and an athlete, particularly good at the long jump. He’s hard-working but poor.”','«حسنًا، في الطابق الأول يسكن جريشام، طالب ممتاز ورياضي، بارع بشكل خاص في الوثب الطويل. إنه مجتهد ولكنه فقير.»'],
['“And the second floor?”','«والطابق الثاني؟»'],
['“Daulat Ras lives there. He is from India – very quiet and hard-working, but Greek translation is his weak subject.”','«يعيش هناك دولت راس. إنه من الهند – هادئ جدًا ومجتهد، لكن الترجمة اليونانية هي نقطة ضعفه.»'],
['“And finally there’s Miles McLaren on the top floor. A very intelligent student, one of the best when he chooses to work – but he’s very lazy and very worried about this exam.”','«وأخيرًا هناك مايلز ماكلارين في الطابق العلوي. طالب ذكي جدًا، من بين الأفضل عندما يقرر أن يدرس – لكنه كسول جدًا وقلق للغاية بشأن هذا الامتحان.»'],
['“Now tell me,” said Holmes, “how tall are these young men?”','قال هولمز: «الآن أخبرني، كم يبلغ طول هؤلاء الشبان؟»'],
['“How tall? What a strange question. Erm … I think Miles is taller than the Indian, but Gresham is the tallest, over six feet.”','«كم يبلغ طولهم؟ يا له من سؤال غريب. إم … أعتقد أن مايلز أطول من الهندي، لكن جريشام هو الأطول، يزيد طوله عن ستة أقدام.»'],
['“Ah, that’s important. Now, Weaver. I wish you goodnight. I’ll return tomorrow.”','«آه، هذا مهم. الآن، ويفر. أتمنى لك ليلة سعيدة. سأعود غدًا.»'],
['Next morning Sherlock Holmes left his house very early before he returned to the tutor’s rooms. Mr Weaver was waiting nervously for him.','في صباح اليوم التالي، غادر شارلوك هولمز منزله في وقت مبكر جدًا قبل أن يعود إلى غرف المدرس. كان السيد ويفر ينتظره بعصبية.']]]
];

const Q=[
['Exercise 1: Underline what you think is the correct answer','التمرين ١: ضع خطًا تحت ما تعتقد أنه الإجابة الصحيحة',[
['Sherlock Holmes was a…','كان شارلوك هولمز…','detective.','محققًا.'],
['He was…','كان…','English.','إنجليزيًا.'],
['He lived in…','عاش في…','London.','لندن.'],
['Stories about him first appeared in the…','ظهرت القصص عنه لأول مرة في…','19th century.','القرن التاسع عشر.']]],
['Exercise 3: Read Part 1 and answer the questions','التمرين ٣: اقرأ الجزء الأول وأجب عن الأسئلة',[
['Who are the people in the picture?','من هم الأشخاص في الصورة؟','Sherlock Holmes and Mr Henry Weaver.','شارلوك هولمز والسيد هنري ويفر.'],
['Where was Sherlock Holmes staying?','أين كان يقيم شارلوك هولمز؟','He was staying in one of England’s most famous university towns.','كان يقيم في واحدة من أشهر المدن الجامعية في إنجلترا.'],
['What did Mr Weaver receive that afternoon?','ماذا استلم السيد ويفر بعد ظهر ذلك اليوم؟','He received the Greek translation papers.','استلم أوراق الترجمة اليونانية.'],
['What was lying on the floor when he returned to his room after tea?','ماذا كان ملقى على الأرض عندما عاد إلى غرفته بعد الشاي؟','The translation papers were lying on the floor by the window.','كانت أوراق الترجمة ملقاة على الأرض بجوار النافذة.'],
['Why couldn’t Mr Weaver call the police?','لماذا لم يستطع السيد ويفر الاتصال بالشرطة؟','Because he couldn’t have a scandal at the college.','لأنه لا يمكن السماح بحدوث فضيحة في الكلية.'],
['Who is Bannister?','من هو بانيستر؟','He is Mr Weaver’s servant.','إنه خادم السيد ويفر.'],
['What clues did Bannister and Mr Weaver find?','ما الأدلة التي وجدها بانيستر والسيد ويفر؟','They found a broken pencil and a small ball of black mud.','وجدا قلم رصاص مكسورًا وكرة صغيرة من الطين الأسود.'],
['What do they think happened?','ماذا يعتقدون أنه حدث؟','They think someone copied the exam questions.','يعتقدون أن شخصًا ما قد نسخ أسئلة الامتحان.']]],
['Exercise 4: Read Part 2. Are these sentences true (✓) or false (✗)? Correct the false ones.','التمرين ٤: اقرأ الجزء الثاني. هل هذه الجمل صحيحة (✓) أم خاطئة (✗)؟ صحح الخاطئة منها.',[
['The tutor’s room was on the same floor as the three students’.','كانت غرفة المدرس في نفس الطابق الذي يسكن فيه الطلاب الثلاثة.','False ✗ The tutor’s room was on the ground floor, and the students lived above him.','خطأ ✗ كانت غرفة المدرس في الطابق الأرضي، والطلاب يعيشون فوقه.'],
['Holmes couldn’t see into the room through the window.','لم يستطع هولمز النظر إلى الغرفة من خلال النافذة.','True ✓','صح ✓'],
['He found a clue on the carpet.','وجد دليلًا على السجادة.','False ✗ He examined the carpet but found “Nothing”. The clues were on the desk and the window table.','خطأ ✗ فحص السجادة ولكنه لم يجد «شيئًا». الأدلة كانت على المكتب وطاولة النافذة.'],
['The papers were next to the window because it was easier to read them in the light.','كانت الأوراق بجوار النافذة لأنه كان من الأسهل قراءتها في الضوء.','False ✗ They were there because from there the person could see when Mr Weaver was returning.','خطأ ✗ كانت هناك لأنه من ذلك المكان يمكن للشخص رؤية متى يعود السيد ويفر.'],
['The intruder saw Mr Weaver returning.','رأى المتسلل السيد ويفر وهو يعود.','False ✗ Nobody could see him because he came back through the side door.','خطأ ✗ لم يستطع أحد رؤيته لأنه عاد من الباب الجانبي.'],
['He escaped through the study window.','هرب من نافذة غرفة الدراسة (المكتب).','False ✗ He escaped through the bedroom window.','خطأ ✗ هرب من نافذة غرفة النوم.'],
['Holmes found another clue in the bedroom.','وجد هولمز دليلًا آخر في غرفة النوم.','True ✓','صح ✓']]],
['Exercise 5: Read Part 3. Which of the three students do you think copied the papers?','التمرين ٥: اقرأ الجزء الثالث. أي من الطلاب الثلاثة تعتقد أنه نسخ الأوراق؟',[
['Which of the three students do you think copied the papers?','أي من الطلاب الثلاثة تعتقد أنه نسخ الأوراق؟','Gresham is the most likely suspect. He is an athlete (good at long jump – which explains the black mud from the jumping pit) and he is the tallest (over six feet – which explains how he could look into the ground-floor window when Holmes couldn’t because he wasn’t tall enough).','جريشام هو المشتبه به الأكثر احتمالًا. إنه رياضي (بارع في الوثب الطويل – مما يفسر الطين الأسود من حفرة القفز) وهو الأطول (طوله أكثر من ستة أقدام – مما يفسر كيف تمكن من النظر في نافذة الطابق الأرضي بينما لم يستطع هولمز ذلك لأنه لم يكن طويلًا بما يكفي).']]],
['Exercise 6: Listening (Part 4)','التمرين ٦: الاستماع (الجزء الرابع)',[
['Whose ideas were correct? Did you guess who copied the papers? How did Sherlock Holmes solve the mystery? What was his explanation? Who wrote the letter? What did it say? Are the examinations going to take place?','أفكار من كانت الصحيحة؟ هل خمنت من نسخ الأوراق؟ كيف حل شارلوك هولمز اللغز؟ ماذا كان تفسيره؟ من كتب الرسالة؟ ماذا قالت؟ هل ستُجرى الامتحانات؟','The answers are in the Part 4 audio recording, which isn’t included in the file.','الإجابات موجودة في التسجيل الصوتي للجزء الرابع، وهو غير موجود في الملف.']]]
];

const V=[['receive','received',0,'يستلم'],['find','found',1,'يجد'],['say','said',1,'يقول'],['walk','walked',0,'يمشي'],['put','put',1,'يضع'],['try','tried',0,'يحاول'],['go','went',1,'يذهب'],['can','could',1,'يستطيع'],['see','saw',1,'يرى'],['copy','copied',0,'ينسخ'],['think','thought',1,'يعتقد / يفكر'],['leave','left',1,'يغادر / يترك'],['examine','examined',0,'يفحص'],['run','ran',1,'يركض']];

$('#story').innerHTML=S.map(p=>`<section class="part"><h2 lang="en">${p[0]}</h2><p class="at">${p[1]}</p><button class="pl">▶ استمع للجزء كاملًا</button>${p[2].map(r=>row(r[0],r[1])).join('')}</section>`).join('');

$('#qa').innerHTML='<button class="ra" aria-pressed="false">اكشف كل الأجوبة</button>'+Q.map(g=>`<section class="part"><h2 lang="en">${g[0]}</h2><p class="at">${g[1]}</p>${g[2].map((x,k)=>`<div class="qa">${row(x[0],x[1],g[2].length>1?k+1:'')}<button class="rv">اكشف الجواب</button><div class="an" hidden>${row(x[2],x[3])}</div></div>`).join('')}</section>`).join('');

$('#verbs').innerHTML=`<section class="part"><h2 lang="en">Exercise 7: Past forms of the verbs</h2><p class="at">القواعد اللغوية: اكتب صيغة الماضي لهذه الأفعال. أي منها شاذ؟ اضغط على أي فعل لسماعه.</p><div class="sc"><table><tr><th>Verb<th>Past<th>النوع<th>المعنى</tr>${V.map(v=>`<tr><td lang="en" class="w">${v[0]}</td><td lang="en" class="w">${v[1]}</td><td class="${v[2]?'ir':''}">${v[2]?'شاذ (Irregular)':'قياسي (Regular)'}</td><td>${v[3]}</td></tr>`).join('')}</table></div></section>`;

const T=['#story','#qa','#verbs'],tabs=[...document.querySelectorAll('[data-tab]')];
function go(i){T.forEach((id,k)=>{$(id).hidden=k!=i;tabs[k].setAttribute('aria-pressed',k==i)});if(ss)ss.cancel();$('main').scrollIntoView()}
tabs.forEach((b,i)=>b.onclick=()=>go(i));
$('#tar').onclick=e=>{const on=document.body.classList.toggle('noar');e.target.setAttribute('aria-pressed',!on)};
$('#tsl').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',!!slow)};
$('#stp').onclick=()=>ss&&ss.cancel();

document.addEventListener('click',e=>{
const t=e.target,w=t.closest('.w'),b=t.closest('.sp'),pl=t.closest('.pl'),rv=t.closest('.rv'),ra=t.closest('.ra');
if(w)say(w.textContent.replace(/[“”.,?!…–:;()]/g,'').trim(),null);
else if(b){const l=b.closest('.ln');say(l.dataset.t,l)}
else if(pl&&ss){ss.cancel();pl.closest('section').querySelectorAll('.ln').forEach(l=>speak(l.dataset.t,l))}
else if(rv){const a=rv.nextElementSibling;a.hidden=!a.hidden;rv.textContent=a.hidden?'اكشف الجواب':'أخفِ الجواب'}
else if(ra){const show=ra.getAttribute('aria-pressed')!=='true';ra.setAttribute('aria-pressed',show);ra.textContent=show?'أخفِ كل الأجوبة':'اكشف كل الأجوبة';document.querySelectorAll('.an').forEach(a=>{a.hidden=!show;a.previousElementSibling.textContent=show?'أخفِ الجواب':'اكشف الجواب'})}
});
</script>
</body>
</html>
